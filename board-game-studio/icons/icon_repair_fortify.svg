<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="toolSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="handleGrip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Wrench (From Top-Left to Bottom-Right) -->
  <g transform="rotate(0, 32, 32)">
    <!-- Wrench Handle Body -->
    <path d="M19 23 L44 48 C46 50 49 50 51 48 C53 46 53 43 51 41 L26 16 Z" 
          fill="url(#toolSteel)" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Wrench Ergonomic Grip Overlay -->
    <path d="M30 34 L43 47 C44.5 48.5 46.5 48.5 48 47 C49.5 45.5 49.5 43.5 48 42 L35 29 Z" 
          fill="url(#handleGrip)" stroke="#0f172a" stroke-width="1.8"/>
    <!-- Grip Hanging Hole -->
    <circle cx="46" cy="45" r="1.8" fill="#cbd5e1"/>

    <!-- Wrench Open-End Head -->
    <path d="M26 16 C27 12 25 8 20 6 C15 4 10 7 9 12 C8 17 11 22 16 23 C17 24 18 24 19 23 L22 19 C19 19 16 16 16 13 C16 10 18 8 21 9 C24 10 25 13 24 16 Z" 
          fill="url(#toolSteel)" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Hammer (From Top-Right to Bottom-Left) -->
  <g transform="rotate(0, 32, 32)">
    <!-- Hammer Handle -->
    <path d="M45 23 L20 48 C18 50 15 50 13 48 C11 46 11 43 13 41 L38 16 Z" 
          fill="url(#toolSteel)" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Hammer Handle Rubber/Wood Grip -->
    <path d="M34 34 L21 47 C19.5 48.5 17.5 48.5 16 47 C14.5 45.5 14.5 43.5 16 42 L29 29 Z" 
          fill="url(#handleGrip)" stroke="#0f172a" stroke-width="1.8"/>

    <!-- Hammer Steel Head (Striking Face on Right, Claw on Left) -->
    <!-- Striking Face -->
    <path d="M41 13 L47 7 L53 13 L47 19 Z" 
          fill="url(#toolSteel)" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="49" y="8" width="5" height="4" rx="0.5" transform="rotate(45, 51.5, 10)" fill="#334155" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Hammer Center Socket Collar -->
    <rect x="36" y="14" width="8" height="6" rx="1" transform="rotate(-45, 40, 17)" fill="#475569" stroke="#0f172a" stroke-width="1.8"/>

    <!-- Hammer Curved Claw / Peen -->
    <path d="M37 17 C35 15 32 15 28 17 C32 20 36 21 39 19 Z" 
          fill="url(#toolSteel)" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
