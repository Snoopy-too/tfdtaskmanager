<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Left Wheat Stalk (Warm Golden Highlights) -->
    <linearGradient id="grainGoldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <!-- Right Wheat Stalk (Slightly Darker Gold Shadow) -->
    <linearGradient id="grainGoldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
  </defs>

  <!-- === LEFT WHEAT EAR (Curving Up & Left) === -->
  <g>
    <!-- Whisker Awns (Fine bristles extending from grain tips) -->
    <path d="M22 8 C20 4 17 2 13 2" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M20 12 C16 9 12 7 8 7" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M23 15 C20 12 15 11 10 12" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M22 20 C18 17 14 17 10 18" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M25 24 C21 21 17 22 13 24" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M24 29 C20 27 16 29 13 32" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Top Terminal Beard Whiskers -->
    <path d="M24 7 C23 3 24 1 25 0" fill="none" stroke="#eab308" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M26 10 C27 6 30 3 33 2" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Stem -->
    <path d="M24 8 C25 24 29 42 22 58" fill="none" stroke="url(#stemGrad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Grain Kernels (Herringbone Braided Arrangement) -->
    <!-- Tip Grain -->
    <path d="M24 7 C22 9 22 12 24 14 C26 12 26 9 24 7 Z" fill="url(#grainGoldLeft)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Pair 1 -->
    <path d="M20 11 C17 13 18 17 21 18 C23 17 23 14 20 11 Z" fill="url(#grainGoldLeft)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M27 11 C30 13 29 17 26 18 C24 17 24 14 27 11 Z" fill="url(#grainGoldRight)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Pair 2 -->
    <path d="M19 17 C16 19 17 23 20 24 C23 23 23 20 19 17 Z" fill="url(#grainGoldLeft)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M27 17 C30 19 30 23 27 24 C24 23 24 20 27 17 Z" fill="url(#grainGoldRight)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Pair 3 -->
    <path d="M20 23 C17 25 18 29 21 30 C24 29 24 26 20 23 Z" fill="url(#grainGoldLeft)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M28 23 C31 25 30 29 27 30 C25 29 25 26 28 23 Z" fill="url(#grainGoldRight)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Pair 4 -->
    <path d="M21 29 C18 31 19 35 22 36 C25 35 25 32 21 29 Z" fill="url(#grainGoldLeft)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M29 29 C32 31 31 35 28 36 C26 35 26 32 29 29 Z" fill="url(#grainGoldRight)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Bottom Kernel -->
    <path d="M23 35 C20 37 21 41 24 41 C27 40 26 37 23 35 Z" fill="url(#grainGoldLeft)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- === RIGHT WHEAT EAR (Curving Up & Right) === -->
  <g>
    <!-- Whisker Awns (Right side) -->
    <path d="M42 8 C44 4 47 2 51 2" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M44 12 C48 9 52 7 56 7" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M41 15 C44 12 49 11 54 12" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M42 20 C46 17 50 17 54 18" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M39 24 C43 21 47 22 51 24" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M40 29 C44 27 48 29 51 32" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Top Terminal Beard Whiskers -->
    <path d="M40 7 C41 3 40 1 39 0" fill="none" stroke="#eab308" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M38 10 C37 6 34 3 31 2" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Stem -->
    <path d="M40 8 C39 24 35 42 42 58" fill="none" stroke="url(#stemGrad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Grain Kernels (Herringbone Braided Arrangement) -->
    <!-- Tip Grain -->
    <path d="M40 7 C38 9 38 12 40 14 C42 12 42 9 40 7 Z" fill="url(#grainGoldRight)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Pair 1 -->
    <path d="M37 11 C34 13 35 17 38 18 C40 17 40 14 37 11 Z" fill="url(#grainGoldLeft)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M44 11 C47 13 46 17 43 18 C41 17 41 14 44 11 Z" fill="url(#grainGoldRight)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Pair 2 -->
    <path d="M37 17 C34 19 34 23 37 24 C40 23 40 20 37 17 Z" fill="url(#grainGoldLeft)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M45 17 C48 19 47 23 44 24 C41 23 41 20 45 17 Z" fill="url(#grainGoldRight)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Pair 3 -->
    <path d="M36 23 C33 25 34 29 37 30 C39 29 39 26 36 23 Z" fill="url(#grainGoldLeft)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M44 23 C47 25 46 29 43 30 C40 29 40 26 44 23 Z" fill="url(#grainGoldRight)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Pair 4 -->
    <path d="M35 29 C32 31 33 35 36 36 C38 35 38 32 35 29 Z" fill="url(#grainGoldLeft)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M43 29 C46 31 45 35 42 36 C39 35 39 32 43 29 Z" fill="url(#grainGoldRight)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Bottom Kernel -->
    <path d="M41 35 C44 37 43 41 40 41 C37 40 38 37 41 35 Z" fill="url(#grainGoldRight)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Crossing Tie Ribbon / Seal in Center -->
  <path d="M28 47 C28 45 36 45 36 47 L35 52 C35 53 29 53 29 52 Z" fill="#b45309" stroke="#0f172a" stroke-width="1.5"/>
  <ellipse cx="32" cy="49" rx="4" ry="2.5" fill="#facc15" stroke="#713f12" stroke-width="1"/>
</svg>
