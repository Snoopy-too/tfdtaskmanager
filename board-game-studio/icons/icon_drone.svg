<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Stealth Fuselage Gradient -->
    <linearGradient id="droneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="80%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Wing Surface Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- Sensor Ball Cyan Glow -->
    <radialGradient id="sensorGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <!-- Missile Warhead Red -->
    <linearGradient id="missileRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <!-- Wing-Mounted Missiles (Left Wing) -->
  <g>
    <rect x="14" y="27" width="3" height="12" rx="1" fill="#cbd5e1" stroke="#0f172a" stroke-width="1"/>
    <path d="M14 27 L15.5 24 L17 27 Z" fill="url(#missileRed)" stroke="#0f172a" stroke-width="0.8"/>
    <polygon points="13,38 14,36 14,39" fill="#0f172a"/>
    <polygon points="18,38 17,36 17,39" fill="#0f172a"/>

    <rect x="20" y="29" width="3" height="11" rx="1" fill="#cbd5e1" stroke="#0f172a" stroke-width="1"/>
    <path d="M20 29 L21.5 26 L23 29 Z" fill="url(#missileRed)" stroke="#0f172a" stroke-width="0.8"/>
  </g>

  <!-- Wing-Mounted Missiles (Right Wing) -->
  <g>
    <rect x="47" y="27" width="3" height="12" rx="1" fill="#cbd5e1" stroke="#0f172a" stroke-width="1"/>
    <path d="M47 27 L48.5 24 L50 27 Z" fill="url(#missileRed)" stroke="#0f172a" stroke-width="0.8"/>
    <polygon points="46,38 47,36 47,39" fill="#0f172a"/>
    <polygon points="51,38 50,36 50,39" fill="#0f172a"/>

    <rect x="41" y="29" width="3" height="11" rx="1" fill="#cbd5e1" stroke="#0f172a" stroke-width="1"/>
    <path d="M41 29 L42.5 26 L44 29 Z" fill="url(#missileRed)" stroke="#0f172a" stroke-width="0.8"/>
  </g>

  <!-- Main Swept Wings (Slender high-altitude glider wings) -->
  <polygon points="4,28 32,23 60,28 60,33 32,28 4,33" fill="url(#wingGrad)" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
  <!-- Wing Aileron Panel Lines -->
  <line x1="10" y1="31" x2="26" y2="27" stroke="#94a3b8" stroke-width="1"/>
  <line x1="38" y1="27" x2="54" y2="31" stroke="#94a3b8" stroke-width="1"/>

  <!-- V-Tail Stabilizers (Rear Fins) -->
  <polygon points="32,49 22,58 20,55 30,46" fill="#334155" stroke="#0f172a" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="32,49 42,58 44,55 34,46" fill="#1e293b" stroke="#0f172a" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Pusher Propeller Engine at Rear -->
  <rect x="30.5" y="49" width="3" height="4" rx="1" fill="#0f172a"/>
  <ellipse cx="32" cy="53" rx="7" ry="1.5" fill="#94a3b8" opacity="0.6"/>

  <!-- Central Stealth Fuselage Body -->
  <path d="M32 5 C35 5 37 10 37 20 L36 46 C36 49 34 50 32 50 C30 50 28 49 28 46 L27 20 C27 10 29 5 32 5 Z" 
        fill="url(#droneBody)" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Fuselage Top Spine Highlight Ridge -->
  <line x1="32" y1="8" x2="32" y2="46" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M29 18 H35" stroke="#475569" stroke-width="1"/>

  <!-- Forward Optical / FLIR Sensor Turret Dome on Nose -->
  <circle cx="32" cy="11" r="3.5" fill="url(#sensorGlow)" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="31" cy="10" r="1" fill="#ffffff"/>
</svg>
