<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="craneSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blockConcrete" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Ground Foundation Base Plates -->
  <line x1="8" y1="58" x2="26" y2="58" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>

  <!-- Vertical Mast (Tower with lattice X-braces) -->
  <line x1="13" y1="16" x2="13" y2="58" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="21" y1="16" x2="21" y2="58" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Mast Lattice Bracing -->
  <line x1="13" y1="18" x2="21" y2="28" stroke="#475569" stroke-width="1.8"/>
  <line x1="21" y1="18" x2="13" y2="28" stroke="#475569" stroke-width="1.8"/>
  <line x1="13" y1="28" x2="21" y2="38" stroke="#475569" stroke-width="1.8"/>
  <line x1="21" y1="28" x2="13" y2="38" stroke="#475569" stroke-width="1.8"/>
  <line x1="13" y1="38" x2="21" y2="48" stroke="#475569" stroke-width="1.8"/>
  <line x1="21" y1="38" x2="13" y2="48" stroke="#475569" stroke-width="1.8"/>
  <line x1="13" y1="48" x2="21" y2="58" stroke="#475569" stroke-width="1.8"/>
  <line x1="21" y1="48" x2="13" y2="58" stroke="#475569" stroke-width="1.8"/>

  <!-- Horizontal Jib & Counter-Jib Structure -->
  <line x1="6" y1="16" x2="58" y2="16" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <line x1="10" y1="12" x2="54" y2="12" stroke="#475569" stroke-width="1.5"/>

  <!-- Jib Internal Lattice Ties -->
  <line x1="21" y1="16" x2="29" y2="12" stroke="#475569" stroke-width="1.2"/>
  <line x1="29" y1="16" x2="37" y2="12" stroke="#475569" stroke-width="1.2"/>
  <line x1="37" y1="16" x2="45" y2="12" stroke="#475569" stroke-width="1.2"/>
  <line x1="45" y1="16" x2="53" y2="12" stroke="#475569" stroke-width="1.2"/>

  <!-- Top Apex Tower / A-Frame Cab -->
  <polygon points="13,16 17,6 21,16" fill="#0f172a" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
  <!-- Stay Cables -->
  <line x1="17" y1="6" x2="8" y2="16" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="17" y1="6" x2="44" y2="12" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Counterweight Blocks on Rear Jib -->
  <rect x="6" y="14" width="6" height="7" rx="1" fill="#334155" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Trolley on Jib -->
  <rect x="41" y="15" width="6" height="3" rx="0.5" fill="#0f172a"/>

  <!-- Hoist Cable -->
  <line x1="44" y1="18" x2="44" y2="34" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Pulley Hook Rig -->
  <path d="M42 34 H46 L44 38 Z" fill="#0f172a"/>
  <!-- Slings -->
  <line x1="44" y1="38" x2="36" y2="44" stroke="#475569" stroke-width="1.2"/>
  <line x1="44" y1="38" x2="52" y2="44" stroke="#475569" stroke-width="1.2"/>

  <!-- Suspended Foundation Block / Slab -->
  <polygon points="34,44 48,40 54,44 40,48" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="34,44 40,48 40,56 34,52" fill="#64748b" stroke="#0f172a" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="40,48 54,44 54,52 40,56" fill="#94a3b8" stroke="#0f172a" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
