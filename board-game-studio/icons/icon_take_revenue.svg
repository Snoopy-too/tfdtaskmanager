<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Top Face Gradient (Brilliant golden shine) -->
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <!-- Front Face Gradient (Rich gold body) -->
    <linearGradient id="goldFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="60%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <!-- Left Face Gradient (Deep gold shadow edge) -->
    <linearGradient id="goldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
  </defs>

  <!-- Left Face -->
  <polygon points="12,33 22,23 22,35 12,47" fill="url(#goldLeft)" stroke="#713f12" stroke-width="2" stroke-linejoin="round"/>
  <!-- Front Face -->
  <polygon points="12,47 22,35 56,25 46,37" fill="url(#goldFront)" stroke="#713f12" stroke-width="2" stroke-linejoin="round"/>
  <!-- Top Face (Trapezoidal Gold Ingot Surface) -->
  <polygon points="22,23 48,15 56,25 22,35" fill="url(#goldTop)" stroke="#713f12" stroke-width="2" stroke-linejoin="round"/>

  <!-- Specular Gold Highlight Glint Lines -->
  <line x1="23" y1="34.5" x2="54" y2="25.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="22.5" y1="23.5" x2="47" y2="16" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Front Bevel Highlight Accent -->
  <line x1="13.5" y1="46" x2="44.5" y2="36.5" stroke="#fde047" stroke-width="1" stroke-linecap="round"/>

  <!-- Star Glint Specular Sparkle at top corner -->
  <path d="M47 16 L49 14 L51 16 L49 18 Z" fill="#ffffff"/>
</svg>
