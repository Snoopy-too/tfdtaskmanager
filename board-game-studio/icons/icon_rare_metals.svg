<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Top Face Gradient (Bright silver reflection) -->
    <linearGradient id="metalTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <!-- Front Face Gradient (Mid-tone silver shadow) -->
    <linearGradient id="metalFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <!-- Left Face Gradient (Darker metallic edge) -->
    <linearGradient id="metalLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Left Face -->
  <polygon points="12,33 22,23 22,35 12,47" fill="url(#metalLeft)" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
  <!-- Front Face -->
  <polygon points="12,47 22,35 56,25 46,37" fill="url(#metalFront)" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
  <!-- Top Face (Trapezoidal Ingot Surface) -->
  <polygon points="22,23 48,15 56,25 22,35" fill="url(#metalTop)" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>

  <!-- Specular Ingot Highlight Line on Top Edge -->
  <line x1="23" y1="34.5" x2="54" y2="25.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="22.5" y1="23.5" x2="47" y2="16" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Front Bevel Accent -->
  <line x1="13.5" y1="46" x2="44.5" y2="36.5" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round"/>
</svg>
