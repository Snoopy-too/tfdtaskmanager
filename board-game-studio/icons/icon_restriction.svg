<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Parchment Scroll Gradient -->
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="60%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="scrollRoll" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <!-- Prohibition Red Ring Gradient -->
    <linearGradient id="prohibitRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
  </defs>

  <!-- Top Scroll Roll -->
  <path d="M12 10 C12 7 16 5 32 5 C48 5 52 7 52 10 C52 13 48 15 32 15 C16 15 12 13 12 10 Z" fill="url(#scrollRoll)" stroke="#0f172a" stroke-width="2"/>

  <!-- Scroll Body Sheet -->
  <path d="M14 10 H50 V50 C50 54 44 57 32 57 C20 57 14 54 14 50 Z" fill="url(#scrollGrad)" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Bottom Scroll Roll Lip -->
  <path d="M10 50 C10 47 16 46 32 46 C48 46 54 47 54 50 C54 55 46 59 32 59 C18 59 10 55 10 50 Z" fill="url(#scrollRoll)" stroke="#0f172a" stroke-width="2"/>

  <!-- Official Decree Document Header & Rows -->
  <rect x="20" y="18" width="24" height="3" rx="1" fill="#0f172a"/>
  <rect x="18" y="24" width="28" height="1.8" rx="0.9" fill="#64748b"/>
  <rect x="18" y="28" width="28" height="1.8" rx="0.9" fill="#64748b"/>
  <rect x="18" y="32" width="22" height="1.8" rx="0.9" fill="#64748b"/>
  <rect x="18" y="36" width="26" height="1.8" rx="0.9" fill="#64748b"/>
  <rect x="18" y="40" width="18" height="1.8" rx="0.9" fill="#64748b"/>

  <!-- Prominent Prohibition / Restriction Badge Overlay (Foreground Focus) -->
  <g transform="translate(4, 4)">
    <!-- Outer Glow / Contrast Border -->
    <circle cx="40" cy="38" r="14" fill="#0f172a"/>
    <!-- Red Prohibition Ring -->
    <circle cx="40" cy="38" r="12" fill="none" stroke="url(#prohibitRed)" stroke-width="4.5"/>
    <!-- Red Prohibition Diagonal Slash Bar -->
    <line x1="31.5" y1="29.5" x2="48.5" y2="46.5" stroke="url(#prohibitRed)" stroke-width="4" stroke-linecap="round"/>
    <!-- Inner Highlight -->
    <circle cx="40" cy="38" r="9" fill="none" stroke="#fecdd3" stroke-width="0.8" opacity="0.5"/>
  </g>
</svg>
